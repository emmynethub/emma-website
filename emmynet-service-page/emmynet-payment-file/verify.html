<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Verify a Certificate - Emmynet ICT Hub</title>
<link rel="stylesheet" href="school.css">
</head>
<body>
<header class="top">
  <a class="brand" href="#home">
    <span class="logo">⌘</span>
    <span>Emmynet<br><b>ICT Hub</b></span>
  </a>
  <nav><a href="../index.html">Home</a></nav>
</header>
<div class="demo-banner">Check the certificates number</div>

<div class="verify-wrap">
  <h1>Verify a Certificate</h1>
  <p class="muted" style="margin-bottom:16px">Type the certificate number printed at the bottom of the certificate, for example EMM-2026-000001.</p>
  <form id="verifyForm">
    <input type="text" id="certNo" placeholder="EMM-2026-000001" autocomplete="off" aria-label="Certificate number">
    <button class="btn" type="submit">Verify</button>
  </form>
  <div id="result" role="status"></div>
</div>

<script src="school-data.js"></script>
<script src="verify.js"></script>
</body>
</html>
